[package]
name = "flux-pay"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.9.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8.x", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "uuid",
    "chrono"
] }
strum = "0.27"
strum_macros = "0.27"
async-trait = "0.1"
dotenvy = "0.15"
