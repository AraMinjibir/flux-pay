services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxpay-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: fluxpay
      POSTGRES_USER: fluxpay
      POSTGRES_PASSWORD: fluxpay

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxpay -d fluxpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fluxpay-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fluxpay:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fluxpay-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: postgres://fluxpay:fluxpay@postgres:5432/fluxpay
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
      HOST: 0.0.0.0
      PORT: 8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data: